image: ubuntu:22.04

definitions:
  steps:
    - step: &build-step
        name: Build
        size: 16x
        script:
          - BRANCH=${BITBUCKET_BRANCH//["/""."]/_}
          - BUILD_ID=${BRANCH}-latest
          - PACKAGE_FILE="gem5-build_${BUILD_ID}.tar.xz"

          - apt update
          - apt install -y autoconf automake autotools-dev bc bison build-essential cmake curl flex gawk git gperf libexpat-dev libglib2.0-dev libgmp-dev libgoogle-perftools-dev libmpc-dev libmpfr-dev libprotobuf-dev libprotoc-dev libslirp-dev libtool m4 ninja-build patchutils protobuf-compiler pre-commit mypy python-is-python3 python3 python3-dev python3-pip python3-venv scons texinfo zlib1g zlib1g-dev xz-utils

          - git submodule update --init
          - bash -x build.sh

          # prepare artifacts for upload
          - mkdir install
          - mkdir artifacts
          - cp -v build/RISCV/gem5.opt install
          - cp -v ext/ramulator2/libramulator.so install

          # create manifest file
          - MAN="install/MANIFEST"
          - echo "Repository   -> $BITBUCKET_REPO_FULL_NAME" >> $MAN
          - echo "Commit       -> $BITBUCKET_COMMIT" >> $MAN
          - echo "Branch       -> $BITBUCKET_BRANCH" >> $MAN
          - echo "Tag          -> $BITBUCKET_TAG" >> $MAN
          - echo "PR           -> $BITBUCKET_PR_ID" >> $MAN
          - echo "Pipeline     -> $BITBUCKET_PIPELINE_UUID" >> $MAN
          - echo "Build Number -> $BITBUCKET_BUILD_NUMBER" >> $MAN

          - cd install
          - XZ_OPT='-T0' tar Jcvf ${PACKAGE_FILE} *
          - sha256sum ${PACKAGE_FILE} > ${PACKAGE_FILE}.sha256
          - mv ${PACKAGE_FILE}* ../artifacts
        artifacts: 
          - artifacts/*
    - step: &upload-step
        name: Upload files
        clone:
          enabled: false
        script:
          - BRANCH=${BITBUCKET_BRANCH//["/""."]/_}
          - BUILD_ID=${BRANCH}-latest
          - PACKAGE_FILE="gem5-build_${BUILD_ID}.tar.xz"
          - CURL_HEADER="Authorization:Bearer ${REPO_DOWNLOADS_TOKEN}"
          - apt-get update
          - apt-get install -y curl
          - pwd
          - la -lah
          - cd artifacts
          - ls -lah
          - curl --fail --request POST --url 'https://api.bitbucket.org/2.0/repositories/eldoradocorp/gem5/downloads' --header "${CURL_HEADER}" -F "files=@${PACKAGE_FILE}"
          - curl --fail --request POST --url 'https://api.bitbucket.org/2.0/repositories/eldoradocorp/gem5/downloads' --header "${CURL_HEADER}" -F "files=@${PACKAGE_FILE}.sha256"
pipelines:
  default:
    - step: *build-step
    - step: *upload-step
